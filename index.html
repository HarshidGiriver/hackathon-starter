<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IdeaBoard - v2.0 (Database Connected)</title>
  <!-- Load Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding-top: 60px;
      margin: 0;
    }
    .container {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      max-width: 450px;
      width: 90%;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .badge {
      background: #dbeafe;
      color: #1e40af;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }
    h1 { font-size: 20px; margin: 0; }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background-color: #1d4ed8; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background: #ef4444;
      padding: 4px 8px;
      font-size: 12px;
    }
    .delete-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Hackathon Idea Board</h1>
      <span class="badge">v2.0 DB LIVE</span>
    </div>

    <div class="input-group">
      <input type="text" id="ideaInput" placeholder="Enter a project idea..." />
      <button onclick="addIdea()">Save</button>
    </div>

    <ul id="ideaList"><li>Loading from database...</li></ul>
  </div>

  <script>
    // PASTE YOUR SUPABASE CREDENTIALS BELOW
    const SUPABASE_URL = "https://moybzsxqizblphwmzkch.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_AlOZPlMH5Pa9ePFiPXmlGg_xCTvqLVt";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. READ: Fetch all ideas from the database on page load
    async function loadIdeas() {
      const { data, error } = await db
        .from("ideas")
        .select("*")
        .order("id", { ascending: false });

      const list = document.getElementById("ideaList");
      list.innerHTML = "";

      if (error) {
        list.innerHTML = `<li style="color:red;">Error: ${error.message}</li>`;
        return;
      }

      data.forEach((item) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <span>${item.content}</span>
          <button class="delete-btn" onclick="deleteIdea(${item.id})">Delete</button>
        `;
        list.appendChild(li);
      });
    }

    // 2. CREATE: Save a new idea to the database
    async function addIdea() {
      const input = document.getElementById("ideaInput");
      const text = input.value.trim();
      if (!text) return;

      await db.from("ideas").insert([{ content: text }]);
      input.value = "";
      loadIdeas(); // Refresh list from DB
    }

    // 3. DELETE: Remove an idea from the database
    async function deleteIdea(id) {
      await db.from("ideas").delete().eq("id", id);
      loadIdeas();
    }

    // Load data immediately when site opens
    loadIdeas();
  </script>
</body>
</html>
