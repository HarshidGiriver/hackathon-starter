<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackathon Starter - v1</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .badge {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px 0;
    }
    p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #334155;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">VERSION 1.0</span>
    <h1>My Live Project</h1>
    <p>This site is hosted on Vercel and synced with GitHub.</p>
    <button onclick="alert('Pipeline is working!')">Test Action</button>
  </div>
</body>
</html>
