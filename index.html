<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IdeaBoard - v1.1</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding-top: 60px;
      margin: 0;
    }
    .container {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      max-width: 450px;
      width: 90%;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .badge {
      background: #dcfce7;
      color: #166534;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }
    h1 {
      font-size: 20px;
      margin: 0;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #334155;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .note {
      font-size: 12px;
      color: #64748b;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Hackathon Idea Board</h1>
      <span class="badge">v1.1 LIVE</span>
    </div>

    <div class="input-group">
      <input type="text" id="ideaInput" placeholder="Enter a project idea..." />
      <button onclick="addIdea()">Add</button>
    </div>

    <ul id="ideaList">
      <li>Sample: AI-powered study planner</li>
    </ul>

    <p class="note">Note: Refreshing the page clears new items. We will fix this with a Database in v2.0!</p>
  </div>

  <script>
    function addIdea() {
      const input = document.getElementById("ideaInput");
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement("li");
      li.textContent = text;
      document.getElementById("ideaList").appendChild(li);
      input.value = "";
    }
  </script>
</body>
</html>
